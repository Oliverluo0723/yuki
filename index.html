<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Yuki</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f17;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage,
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 入口：點一下開始 */
      #entry {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0f17;
        color: #c9cfd6;
        font-family: Georgia, 'Noto Serif TC', serif;
        text-align: center;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.8s ease;
      }
      #entry.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .entry-title {
        margin: 0 0 6px;
        font-weight: normal;
        font-size: 2rem;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: #f2f5fa;
      }
      .entry-line {
        margin: 0;
        font-size: 1rem;
      }
      .entry-start {
        margin: 28px 0 0;
        font-size: 0.95rem;
        color: #f2f5fa;
        opacity: 0.8;
      }
      .entry-small {
        margin: 0;
        font-size: 0.78rem;
        opacity: 0.55;
        word-break: break-all;
      }
      .entry-start + .entry-small {
        margin-top: 20px;
      }
      .entry-credit {
        position: absolute;
        bottom: calc(18px + env(safe-area-inset-bottom));
        font-size: 0.72rem;
        color: inherit;
        opacity: 0.45;
      }

      /* 右下角的模式標籤：畫面上唯一的常駐介面 */
      #label {
        position: fixed;
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        z-index: 5;
        padding: 16px;
        border: 0;
        background: none;
        color: #f2f5fa;
        mix-blend-mode: difference;
        font: 12px Georgia, 'Noto Serif TC', serif;
        letter-spacing: 0.05em;
        opacity: 0.45;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      #notice {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(56px + env(safe-area-inset-bottom));
        z-index: 5;
        padding: 0 24px;
        text-align: center;
        color: #f2f5fa;
        mix-blend-mode: difference;
        font: 12px Georgia, 'Noto Serif TC', serif;
        opacity: 0.6;
        transition: opacity 1s ease;
        pointer-events: none;
      }
      #notice.leaving {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
